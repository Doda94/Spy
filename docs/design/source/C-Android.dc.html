<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>C Karta — Android — spy reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF7A5C}a:hover{color:#FFA48E}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; overflow: hidden; background: #161311; color: #F3EDE2; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; padding: 40px 0 24px">

  <div style="height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 4px">
    <button aria-label="Prekini igru" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #F3EDE2; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="flex: 1; display: flex; flex-direction: column; padding-left: 4px">
      <span style="font-size: 20px; font-weight: 600">Igrač 3 od 8</span>
      <span style="font-size: 14px; color: #A89F94">Luka</span>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 0 24px">
    <button onClick="{{ toggle }}" aria-label="{{ cardLabel }}" style="width: 320px; height: 440px; padding: 0; border: none; background: transparent; color: inherit; perspective: 1400px; transform: rotate(-2deg)">
      <div style="position: relative; width: 320px; height: 440px; transform-style: preserve-3d; transition: transform 520ms cubic-bezier(.2,.9,.25,1.15); transform: rotateY({{ flipDeg }}deg)">

        <div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; filter: drop-shadow(0 24px 40px rgba(0,0,0,0.55))">
          <svg width="320" height="440" viewBox="0 0 320 440" style="position: absolute; inset: 0"><polygon points="22,0 298,0 320,22 320,418 298,440 22,440 0,418 0,22" fill="#0F0D0B" stroke="#3A322B" stroke-width="1.5"></polygon><polygon points="26,12 294,12 308,26 308,414 294,428 26,428 12,414 12,26" fill="none" stroke="#FF5B38" stroke-opacity="0.55" stroke-width="1.5"></polygon></svg>
          <div aria-hidden="true" style="position: absolute; left: 26px; top: 24px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FF5B38">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; line-height: 1; font-weight: 800">Š</span>
            <svg width="16" height="22" viewBox="0 0 56 76"><polygon points="25,0 0,36 25,72" fill="currentColor"></polygon><polygon points="31,4 56,40 31,76" fill="currentColor"></polygon></svg>
          </div>
          <div aria-hidden="true" style="position: absolute; right: 26px; bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FF5B38; transform: rotate(180deg)">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; line-height: 1; font-weight: 800">Š</span>
            <svg width="16" height="22" viewBox="0 0 56 76"><polygon points="25,0 0,36 25,72" fill="currentColor"></polygon><polygon points="31,4 56,40 31,76" fill="currentColor"></polygon></svg>
          </div>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 40px">
            <svg aria-hidden="true" width="52" height="70" viewBox="0 0 56 76" style="color: #FF5B38"><polygon points="25,0 0,36 25,72" fill="currentColor"></polygon><polygon points="31,4 56,40 31,76" fill="currentColor"></polygon></svg>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #A89F94">Ti si</span>
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 68px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">Špijun</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #A89F94">Kategorija</span>
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; color: #FF7A5C">Mjesta</span>
            </div>
            <div style="width: 200px; border-top: 1.5px dashed #3A322B"></div>
            <div style="display: flex; align-items: center; gap: 10px">
              <svg aria-hidden="true" width="14" height="19" viewBox="0 0 56 76" style="color: #FF5B38"><polygon points="25,0 0,36 25,72" fill="currentColor"></polygon><polygon points="31,4 56,40 31,76" fill="currentColor"></polygon></svg>
              <span style="font-size: 15px; color: #A89F94">Drugi špijun:</span>
              <span style="font-size: 20px; font-weight: 700">Ana</span>
            </div>
          </div>
        </div>

        <div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); filter: drop-shadow(0 24px 40px rgba(0,0,0,0.55))">
          <svg width="320" height="440" viewBox="0 0 320 440" style="position: absolute; inset: 0"><polygon points="22,0 298,0 320,22 320,418 298,440 22,440 0,418 0,22" fill="#2A221C" stroke="#4A3D33" stroke-width="1.5"></polygon></svg>
          <div aria-hidden="true" style="position: absolute; inset: 20px; border-radius: 6px; background: repeating-linear-gradient(45deg, rgba(255,91,56,0.22) 0 1.5px, transparent 1.5px 18px), repeating-linear-gradient(-45deg, rgba(255,91,56,0.22) 0 1.5px, transparent 1.5px 18px)"></div>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
            <div style="width: 128px; height: 128px; border-radius: 50%; background: #2A221C; box-shadow: 0 0 0 2px #FF5B38, 0 0 0 10px #2A221C; display: flex; align-items: center; justify-content: center">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 72px; line-height: 1; font-weight: 800; color: #FF5B38">Š</span>
            </div>
          </div>
        </div>
      </div>
    </button>

    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; font-size: 16px; line-height: 1.4; color: #A89F94; text-align: center; max-width: 320px">Blefiraj. Znaš samo kategoriju — Ana zna isto.</p>
    </sc-if>
    <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; font-size: 18px; line-height: 1.4; text-align: center; max-width: 320px">Dodaj telefon Luki. Neka nitko drugi ne gleda.</p>
    </sc-if>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 0 24px 8px">
    <div aria-label="Igrač 3 od 8" style="display: flex; justify-content: center; gap: 8px">
      <div style="width: 14px; height: 20px; border-radius: 3px; background: #F3EDE2"></div>
      <div style="width: 14px; height: 20px; border-radius: 3px; background: #F3EDE2"></div>
      <div style="width: 14px; height: 20px; border-radius: 3px; background: #FF5B38; transform: translateY(-4px) rotate(-6deg)"></div>
      <div style="width: 14px; height: 20px; border-radius: 3px; box-sizing: border-box; border: 1.5px solid #4A3D33"></div>
      <div style="width: 14px; height: 20px; border-radius: 3px; box-sizing: border-box; border: 1.5px solid #4A3D33"></div>
      <div style="width: 14px; height: 20px; border-radius: 3px; box-sizing: border-box; border: 1.5px solid #4A3D33"></div>
      <div style="width: 14px; height: 20px; border-radius: 3px; box-sizing: border-box; border: 1.5px solid #4A3D33"></div>
      <div style="width: 14px; height: 20px; border-radius: 3px; box-sizing: border-box; border: 1.5px solid #4A3D33"></div>
    </div>
    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ hide }}" style="width: 100%; height: 72px; border: none; border-radius: 20px; background: #FF5B38; color: #1A0905; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"></path><path d="M18 3v4h-4M6 21v-4h4"></path></svg>
        Okreni i dodaj dalje
      </button>
    </sc-if>
    <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ show }}" style="width: 100%; height: 72px; border: none; border-radius: 36px; background: #F3EDE2; color: #161311; font-size: 19px; font-weight: 700">Okreni kartu</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startHidden":{"editor":"boolean","default":false},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const revealed = st.revealed !== undefined ? st.revealed : !(this.props.startHidden ?? false);
    return {
      revealed: revealed,
      hidden: !revealed,
      flipDeg: revealed ? 0 : 180,
      cardLabel: revealed ? 'Tvoja uloga: špijun. Kategorija: Mjesta. Drugi špijun: Ana. Dodirni za skrivanje.' : 'Karta je okrenuta. Dodirni za prikaz uloge.',
      toggle: () => this.setState({ revealed: !revealed }),
      show: () => this.setState({ revealed: true }),
      hide: () => this.setState({ revealed: false })
    };
  }
}
</script>
</body>
</html>
