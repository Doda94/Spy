<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>H 03 Annotated role reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Hanken+Grotesk:wght@400..800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FF6B3D}a:hover{color:#FF8B68}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 1860px; height: 1300px; box-sizing: border-box; background: #0B0A09; color: #F3EDE2; font-family: 'Hanken Grotesk', sans-serif; overflow: hidden">
  <div style="position: absolute; left: 64px; top: 56px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #A39C94; letter-spacing: 0.06em">PHASE 4 · H·03 · ANNOTATED</span>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">Role reveal · citizen</h1>
  </div>

  <sc-for list="{{ phones }}" as="p" hint-placeholder-count="2">
    <div style="position: absolute; left: {{ p.x }}px; top: 220px; width: {{ p.w }}px; height: {{ p.h }}px; overflow: hidden; border-radius: {{ p.pr }}px; background: #121110; box-shadow: 0 0 0 1.5px #34302C">
      <div style="position: absolute; inset: 0; transform-origin: {{ p.origin }}; transform: rotate(-90deg) scale(1.3)">
        <div style="position: absolute; left: {{ p.tableL }}px; top: {{ p.tableT }}px; width: 344px; height: 344px; border-radius: 50%; background: #1A1816; box-shadow: inset 0 0 0 1.5px #34302C"></div>
        <sc-for list="{{ p.seats }}" as="c" hint-placeholder-count="8">
          <div style="position: absolute; left: {{ c.l }}px; top: {{ c.t }}px; width: 56px; height: 78px; transform: {{ c.tf }}; opacity: {{ c.op }}">
            <svg width="56" height="78" viewBox="0 0 56 78"><polygon points="5,0 51,0 56,5 56,73 51,78 5,78 0,73 0,5" fill="#2A221C" stroke="#4A3D33" stroke-width="1"></polygon></svg>
          </div>
        </sc-for>
      </div>
      <div style="position: absolute; left: {{ p.cardL }}px; top: {{ p.cardT }}px; width: 300px; height: 420px; filter: drop-shadow(0 24px 40px rgba(0,0,0,0.6))">
        <svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0"><polygon points="21,0 279,0 300,21 300,399 279,420 21,420 0,399 0,21" fill="#F3EDE2"></polygon><polygon points="25,12 275,12 288,25 288,395 275,408 25,408 12,395 12,25" fill="none" stroke="#1F3FA8" stroke-opacity="0.45" stroke-width="1.5"></polygon></svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 30px; text-align: center; color: #1A1714">
          <svg aria-hidden="true" width="40" height="54" viewBox="0 0 56 76" style="color: #1F3FA8"><polygon points="28,0 56,38 28,76 0,38" fill="currentColor"></polygon></svg>
          <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #6B645C">TAJNA RIJEČ</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 46px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">Svemirska postaja</span>
          <div style="width: 160px; border-top: 1.5px dashed #C9C2B9"></div>
          <span style="font-size: 15px; color: #6B645C">Kategorija · <strong style="color: #1A1714">Mjesta</strong></span>
        </div>
      </div>
      <div style="position: absolute; left: 16px; right: 16px; top: {{ p.navTop }}px; display: flex; align-items: center; justify-content: space-between">
        <span style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: {{ p.nbBg }}; border: 1px solid {{ p.nbLine }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3EDE2" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
        <span style="height: 40px; padding: 0 16px; border-radius: 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; background: {{ p.pillBg }}; border: 1px solid {{ p.nbLine }}">Igrač 3 od 8</span>
        <span style="width: 48px"></span>
      </div>
      <div style="position: absolute; left: 20px; right: 20px; bottom: {{ p.bot }}px; display: flex; flex-direction: column; gap: 10px; align-items: center">
        <span style="font-size: 13px; color: #A39C94">Sakriva se za 6 s</span>
        <span style="position: relative; width: 100%; height: {{ p.bh }}px; border-radius: {{ p.br }}px; background: #F3EDE2; color: #121110; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; overflow: hidden">Sakrij i dalje<span style="position: absolute; left: 0; bottom: 0; height: 4px; width: 75%; background: #121110; opacity: 0.35"></span></span>
      </div>
    </div>
  </sc-for>

  <sc-for list="{{ notes }}" as="n" hint-placeholder-count="15">
    <div style="position: absolute; left: {{ n.hx }}px; top: {{ n.ly }}px; width: {{ n.hw }}px; height: 1px; background: #FF6B3D"></div>
    <div style="position: absolute; left: {{ n.vx }}px; top: {{ n.vy }}px; width: 1px; height: {{ n.vh }}px; background: #FF6B3D"></div>
    <div style="position: absolute; left: {{ n.dx }}px; top: {{ n.dy }}px; width: 9px; height: 9px; border-radius: 5px; background: #FF6B3D; box-shadow: 0 0 0 3px #0B0A09"></div>
    <div style="position: absolute; left: {{ n.bx }}px; top: {{ n.by }}px; width: 360px; text-align: {{ n.align }}; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 15px; font-weight: 700; line-height: 1.3">{{ n.title }}</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.5; color: #A39C94">{{ n.body }}</span>
    </div>
  </sc-for>

  <span style="position: absolute; left: 520px; top: 1086px; font-size: 14px; color: #A39C94">iOS 26 · 390 × 844 pt</span>
  <span style="position: absolute; left: 1000px; top: 1157px; font-size: 14px; color: #A39C94">Android 16 · 412 × 915 dp</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1860,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const TOP = 220;
    const mkPhone = function (ios) {
      const w = ios ? 390 : 412, cy = ios ? 430 : 470, cx = w / 2;
      const seats = [];
      for (let i = 0; i < 8; i++) {
        const th = (90 + 45 * i) * Math.PI / 180;
        seats.push({ l: (cx + 130 * Math.cos(th) - 28).toFixed(1), t: (cy + 130 * Math.sin(th) - 39).toFixed(1), tf: 'rotate(' + (45 * i) + 'deg)', op: i === 2 ? 0 : 0.4 });
      }
      return { x: ios ? 520 : 1000, w: w, h: ios ? 844 : 915, pr: ios ? 48 : 36, origin: cx + 'px ' + cy + 'px', tableL: cx - 172, tableT: cy - 172, seats: seats,
        cardL: (w - 300) / 2, cardT: ios ? 124 : 132, navTop: ios ? 58 : 48, nbBg: ios ? 'rgba(255,255,255,0.08)' : 'transparent', nbLine: ios ? 'rgba(255,255,255,0.16)' : 'transparent',
        pillBg: ios ? 'rgba(255,255,255,0.08)' : '#262320', bh: ios ? 56 : 64, br: ios ? 28 : 16, bot: ios ? 34 : 24 };
    };
    const left = [
      [40, 82, 40, 'GlassButton · 48 pt · Native iOS', '.glassEffect(.regular.interactive())\na11y "Prekini igru" → quit_title'],
      [195, 82, 150, 'Pill · 40 pt · glass', 'reveal_player_of · label 15/600'],
      [60, 200, 260, 'RoleCard · 300×420 · Shared', 'SpyShape.card(22) · frame cut 14\ncentre x · top 124 · shadow.card'],
      [70, 410, 380, 'word.display · 46 sp here', 'auto-fit 56→40 · 2 lines · no hyphen\nBricolage 800 · −3%'],
      [110, 492, 490, 'Category line · body 15', 'reveal_category · muted on ivory 5.0:1'],
      [30, 690, 610, 'SpyTable · Shared', 'r 172 · seats r 130 · 56×78\ncamera rotationZ −45°·seat · scale 1.3 · others α 0.4'],
      [100, 786, 720, 'SpyButton Primary · 56 capsule', 'reveal_hide_next · 4 pt bar = auto-hide 8 s\nhaptic HideCard on tap'],
      [195, 840, 830, 'Safe areas', 'top 58 (no fake status bar) · bottom 34']
    ];
    const right = [
      [372, 72, 60, 'IconButton · 48 dp · Native Android', 'no glass on Android · contentDescription set'],
      [206, 72, 150, 'Pill on surface2', 'same copy key, tonal fill instead of glass'],
      [356, 300, 290, 'Same RoleCard · Shared', 'pixel-identical on both platforms'],
      [356, 520, 470, 'Reveal haptics', 'citizen: CONFIRM · spy: composition THUD ×2\niOS: impact .medium / .heavy ×2'],
      [390, 650, 610, 'Same SpyTable · Shared', 'Reduce Motion: no turn, ring on seat, cross-fade'],
      [380, 862, 760, 'SpyButton Primary · 64 dp', 'SpyShape.md 16 → full on press (M3 Expressive)'],
      [206, 906, 880, 'Edge-to-edge', 'WindowInsets · gesture inset 24']
    ];
    const notes = [];
    left.forEach(function (n) {
      const tx = 520 + n[0], ty = TOP + n[1], ly = TOP + n[2];
      notes.push({ hx: 440, hw: tx - 440, ly: ly, vx: tx, vy: Math.min(ly, ty), vh: Math.abs(ty - ly) + 1, dx: tx - 4, dy: ty - 4, bx: 64, by: ly - 22, align: 'right', title: n[3], body: n[4] });
    });
    right.forEach(function (n) {
      const tx = 1000 + n[0], ty = TOP + n[1], ly = TOP + n[2];
      notes.push({ hx: tx, hw: 1432 - tx, ly: ly, vx: tx, vy: Math.min(ly, ty), vh: Math.abs(ty - ly) + 1, dx: tx - 4, dy: ty - 4, bx: 1440, by: ly - 22, align: 'left', title: n[3], body: n[4] });
    });
    return { phones: [mkPhone(true), mkPhone(false)], notes: notes };
  }
}
</script>
</body>
</html>
