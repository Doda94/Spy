      <span style="width: 8px; height: 8px; border-radius: 4px; background: #F6EFE4"></span>

  <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center">
      <div style="position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center">
        <div aria-hidden="true" style="position: absolute; inset: -24px; border-radius: 50%; background: radial-gradient(circle, rgba(255,181,71,0) 0 38%, rgba(255,196,107,0.75) 40.5%, rgba(255,140,66,0.28) 50%, rgba(255,110,60,0.08) 62%, rgba(11,9,21,0) 72%); animation: corona 2.4s ease-in-out infinite"></div>
        <div style="position: relative; width: 232px; height: 232px; border-radius: 50%; background: radial-gradient(circle at 42% 38%, #181430 0%, #07060D 70%); box-shadow: 0 0 0 2px #FFD08A, inset 0 0 40px rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">

        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; align-items: center">
        <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 42px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em">Ti si špijun.</h1>

          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A79FBF">U sjeni s tobom</span>
          <span style="font-size: 20px; font-weight: 700">Ana</span>
        </div>
      </div>

  <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center">
      <div style="position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center">
        <div style="width: 232px; height: 232px; border-radius: 50%; background: #13102A; box-shadow: 0 0 0 1.5px rgba(246,239,228,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">

        <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 28px; line-height: 1.15; font-weight: 600">Dodaj telefon Luki</h1>
        <p style="margin: 0; font-size: 17px; line-height: 1.4; color: #A79FBF; max-width: 300px">Neka nitko drugi ne gleda u ekran.</p>
      </div>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
      <span style="font-size: 14px; color: #A79FBF">Uloga je vidljiva samo dok držiš.</span>
    </sc-if>
    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
      <button onPointerUp="{{ hide }}" onPointerLeave="{{ hide }}" style="width: 100%; height: 72px; border-radius: 36px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 700; color: #1A1206; background: rgba(255,196,107,0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,230,190,0.7); box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 0 0 6px rgba(255,181,71,0.18), 0 0 40px rgba(255,181,71,0.35); transform: scale(0.97)">

      </button>
    </sc-if>
    <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
      <button onPointerDown="{{ show }}" style="width: 100%; height: 72px; border-radius: 36px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 700; color: #F6EFE4; background: rgba(255,255,255,0.09); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 10px 30px rgba(0,0,0,0.4)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg>
        Drži za prikaz
      </button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startHidden":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const revealed = st.revealed !== undefined ? st.revealed : !(this.props.startHidden ?? false);
    return {
      revealed: revealed,
      hidden: !revealed,
      show: () => this.setState({ revealed: true }),
      hide: () => { if (this.state && this.state.revealed === false) return; this.setState({ revealed: false }); }
    };
  }
}
</script>
</body>
</html>
