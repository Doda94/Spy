<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>A Cenzura — iOS — spy reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#F5D90A}a:hover{color:#fff27a}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0A0B; color: #F2F1EC; font-family: 'Archivo', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; padding: 58px 20px 30px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px">
    <button aria-label="Prekini igru" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #F2F1EC; background: rgba(255,255,255,0.08); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255,255,255,0.16); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 24px rgba(0,0,0,0.45)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="height: 40px; padding: 0 16px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.04em; background: rgba(255,255,255,0.08); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.16); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18)">
      <span style="color: #9C9B95">IGRAČ</span><span style="font-weight: 600">03 / 08</span>
    </div>
    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
      <div aria-label="Skriva se za 4 sekunde" style="width: 48px; height: 48px; position: relative; display: flex; align-items: center; justify-content: center">
        <svg width="48" height="48" viewBox="0 0 48 48" style="position: absolute; inset: 0; transform: rotate(-90deg)"><circle cx="24" cy="24" r="20" fill="none" stroke="#26262A" stroke-width="3"></circle><circle cx="24" cy="24" r="20" fill="none" stroke="#F5D90A" stroke-width="3" stroke-dasharray="125.6" stroke-dashoffset="25"></circle></svg>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">4</span>
      </div>
    </sc-if>
    <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
      <div style="width: 48px; height: 48px"></div>
    </sc-if>
  </div>

  <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #9C9B95">ULOGA · LUKA</div>
        <h1 style="margin: 0; padding-top: 10px; font-size: 104px; line-height: 0.92; font-weight: 900; font-variation-settings: 'wdth' 62; text-transform: uppercase; letter-spacing: -0.005em">Ti si<br>špijun.</h1>
      </div>

      <div style="display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #9C9B95">TAJNA RIJEČ</div>
          <div aria-label="Tajna riječ je skrivena od tebe" style="display: flex; flex-direction: column; gap: 8px">
            <div style="width: 86%; height: 34px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
            <div style="width: 52%; height: 34px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #9C9B95">KATEGORIJA · TVOJ JEDINI TRAG</div>
          <div style="display: flex">
            <span style="background: #F5D90A; color: #0A0A0B; font-size: 40px; line-height: 1.05; font-weight: 800; font-variation-settings: 'wdth' 75; text-transform: uppercase; padding: 2px 10px 0; transform: rotate(-1deg)">Mjesta</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #9C9B95">DRUGI ŠPIJUN</div>
          <div style="display: flex; align-items: center; gap: 14px">
            <div aria-hidden="true" style="width: 40px; height: 40px; box-sizing: border-box; border: 2px solid #F2F1EC; background: repeating-linear-gradient(135deg, #F2F1EC 0 3px, transparent 3px 7px)"></div>
            <span style="font-size: 32px; font-weight: 800; font-variation-settings: 'wdth' 75; text-transform: uppercase">Ana</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #9C9B95">igrač 06</span>
          </div>
        </div>
      </div>

      <p style="margin: 0; font-size: 16px; line-height: 1.4; color: #9C9B95; max-width: 300px">Blefiraj. Riječ ne znaš — znaš samo kategoriju. Ana zna isto što i ti.</p>
    </div>
  </sc-if>

  <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #9C9B95">NA REDU JE</div>
        <h1 style="margin: 0; padding-top: 10px; font-size: 128px; line-height: 0.92; font-weight: 900; font-variation-settings: 'wdth' 62; text-transform: uppercase">Luka</h1>
      </div>
      <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 10px">
        <div style="width: 92%; height: 34px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
        <div style="width: 64%; height: 34px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
        <div style="width: 78%; height: 34px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
      </div>
      <p style="margin: 0; font-size: 18px; line-height: 1.4; color: #F2F1EC; max-width: 300px">Neka nitko drugi ne gleda u ekran.</p>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 18px">
    <div aria-label="Igrač 3 od 8" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; background: #F2F1EC"></div>
      <div style="height: 4px; background: #F2F1EC"></div>
      <div style="height: 4px; background: #F5D90A"></div>
      <div style="height: 4px; background: #2A2A2E"></div>
      <div style="height: 4px; background: #2A2A2E"></div>
      <div style="height: 4px; background: #2A2A2E"></div>
      <div style="height: 4px; background: #2A2A2E"></div>
      <div style="height: 4px; background: #2A2A2E"></div>
    </div>
    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ hide }}" style="height: 60px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.35); background: rgba(245,217,10,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 10px 30px rgba(245,217,10,0.18); color: #0A0A0B; font-size: 18px; font-weight: 800; font-variation-settings: 'wdth' 90; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6"></rect><path d="M3 4h18M3 20h18"></path></svg>
        Sakrij i sljedeći igrač
      </button>
    </sc-if>
    <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ show }}" style="height: 60px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.5); background: rgba(242,241,236,0.94); box-shadow: inset 0 1px 0 rgba(255,255,255,0.7); color: #0A0A0B; font-size: 18px; font-weight: 800; font-variation-settings: 'wdth' 90">Prikaži ulogu</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startHidden":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const revealed = st.revealed !== undefined ? st.revealed : !(this.props.startHidden ?? false);
    return {
      revealed: revealed,
      hidden: !revealed,
      show: () => this.setState({ revealed: true }),
      hide: () => this.setState({ revealed: false })
    };
  }
}
</script>
</body>
</html>
