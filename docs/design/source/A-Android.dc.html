<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>A Cenzura — Android — spy reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#F5D90A}a:hover{color:#fff27a}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0A0B; color: #F2F1EC; font-family: 'Archivo', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; padding: 40px 0 24px">

  <div style="height: 64px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px">
    <button aria-label="Prekini igru" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #F2F1EC; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; padding-left: 4px">
      <span style="font-size: 20px; font-weight: 700; font-variation-settings: 'wdth' 90">Igrač 3 od 8</span>
    </div>
    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
      <div aria-label="Skriva se za 4 sekunde" style="width: 48px; height: 48px; position: relative; display: flex; align-items: center; justify-content: center">
        <svg width="44" height="44" viewBox="0 0 48 48" style="position: absolute; inset: 2px; transform: rotate(-90deg)"><circle cx="24" cy="24" r="20" fill="none" stroke="#26262A" stroke-width="4"></circle><circle cx="24" cy="24" r="20" fill="none" stroke="#F5D90A" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="25"></circle></svg>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">4</span>
      </div>
    </sc-if>
  </div>

  <div aria-label="Igrač 3 od 8" style="padding: 4px 20px 0">
    <svg width="372" height="12" viewBox="0 0 372 12" fill="none" stroke-linecap="round">
      <path d="M2 6 Q7 1 12 6 T22 6 T32 6 T42 6 T52 6 T62 6 T72 6 T82 6 T92 6 T102 6 T112 6 T122 6 T132 6 T142 6" stroke="#F5D90A" stroke-width="4"></path>
      <path d="M154 6 H360" stroke="#2A2A2E" stroke-width="4"></path>
      <circle cx="368" cy="6" r="2" fill="#F5D90A"></circle>
    </svg>
  </div>

  <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px; padding: 0 24px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #9C9B95">ULOGA · LUKA</div>
        <h1 style="margin: 0; padding-top: 10px; font-size: 112px; line-height: 0.92; font-weight: 900; font-variation-settings: 'wdth' 62; text-transform: uppercase; letter-spacing: -0.005em">Ti si<br>špijun.</h1>
      </div>

      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #9C9B95">TAJNA RIJEČ</div>
          <div aria-label="Tajna riječ je skrivena od tebe" style="display: flex; flex-direction: column; gap: 8px">
            <div style="width: 86%; height: 36px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
            <div style="width: 52%; height: 36px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #9C9B95">KATEGORIJA · TVOJ JEDINI TRAG</div>
          <div style="display: flex">
            <span style="background: #F5D90A; color: #0A0A0B; font-size: 42px; line-height: 1.05; font-weight: 800; font-variation-settings: 'wdth' 75; text-transform: uppercase; padding: 2px 10px 0; transform: rotate(-1deg)">Mjesta</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #9C9B95">DRUGI ŠPIJUN</div>
          <div style="display: flex; align-items: center; gap: 14px">
            <div aria-hidden="true" style="width: 40px; height: 40px; box-sizing: border-box; border: 2px solid #F2F1EC; background: repeating-linear-gradient(135deg, #F2F1EC 0 3px, transparent 3px 7px)"></div>
            <span style="font-size: 32px; font-weight: 800; font-variation-settings: 'wdth' 75; text-transform: uppercase">Ana</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #9C9B95">igrač 06</span>
          </div>
        </div>
      </div>
      <p style="margin: 0; font-size: 16px; line-height: 1.4; color: #9C9B95; max-width: 320px">Blefiraj. Riječ ne znaš — znaš samo kategoriju. Ana zna isto što i ti.</p>
    </div>
  </sc-if>

  <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px; padding: 0 24px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #9C9B95">NA REDU JE</div>
        <h1 style="margin: 0; padding-top: 10px; font-size: 136px; line-height: 0.92; font-weight: 900; font-variation-settings: 'wdth' 62; text-transform: uppercase">Luka</h1>
      </div>
      <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 10px">
        <div style="width: 92%; height: 36px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
        <div style="width: 64%; height: 36px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
        <div style="width: 78%; height: 36px; background: repeating-linear-gradient(135deg, #2B2B2F 0 7px, #1A1A1D 7px 14px)"></div>
      </div>
      <p style="margin: 0; font-size: 18px; line-height: 1.4; max-width: 320px">Neka nitko drugi ne gleda u ekran.</p>
    </div>
  </sc-if>

  <div style="padding: 0 24px 8px">
    <sc-if value="{{ revealed }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ hide }}" style="width: 100%; height: 72px; border: none; border-radius: 20px; background: #F5D90A; color: #0A0A0B; font-size: 19px; font-weight: 800; font-variation-settings: 'wdth' 90; display: flex; align-items: center; justify-content: center; gap: 12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6"></rect><path d="M3 4h18M3 20h18"></path></svg>
        Sakrij i sljedeći igrač
      </button>
    </sc-if>
    <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ show }}" style="width: 100%; height: 72px; border: none; border-radius: 36px; background: #F2F1EC; color: #0A0A0B; font-size: 19px; font-weight: 800; font-variation-settings: 'wdth' 90">Prikaži ulogu</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startHidden":{"editor":"boolean","default":false},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const revealed = st.revealed !== undefined ? st.revealed : !(this.props.startHidden ?? false);
    return {
      revealed: revealed,
      hidden: !revealed,
      show: () => this.setState({ revealed: true }),
      hide: () => this.setState({ revealed: false })
    };
  }
}
</script>
</body>
</html>
