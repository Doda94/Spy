# Novi Worker za v2 — odvojen od produkcijskog Workera `spy` i baze `spy-words` s grane main.
name = "spy-v2"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "spy-dictionaries"
# Postavlja vlasnik nakon `npx wrangler d1 create spy-dictionaries` (vidi server/README.md).
# Lokalni razvoj i testovi rade i s ovom vrijednošću; deploy ne.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
