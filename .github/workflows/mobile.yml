name: Mobile

on:
  pull_request:
    branches: [v2]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: [v2]
    paths: ["mobile/**"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests and debug APK
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
