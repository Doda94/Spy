name: Mobile

on:
  pull_request:
    # Filters on the PR's base: v2, and the stacked feat/v2-* PRs that build on each other.
    branches: [v2, "feat/v2-**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: [v2]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests and debug APK
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Engine tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: iOS app for the simulator
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
