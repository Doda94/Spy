name: Server

on:
  pull_request:
    # Filters on the PR's base: v2, and the stacked feat/v2-* PRs that build on each other.
    branches: [v2, "feat/v2-**"]
    paths: ["server/**", "data/**", ".github/workflows/server.yml"]
  push:
    branches: [v2]
    paths: ["server/**", "data/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests (workerd)
        run: npm test
      - name: seed.sql matches data/*.json
        run: npm run seed:check
      - name: Worker bundles
        run: npm run build:check
